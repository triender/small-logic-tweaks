plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'jacoco'
	id "com.modrinth.minotaur" version "2.9.0"
}

version = project.mod_version
group = project.maven_group

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Cung cấp API để viết test
	testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
	// Cung cấp Engine để chạy test
	testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
	// Cung cấp Launcher cho Gradle Test Executor
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// 2. Thư viện Fabric GameTest API cho Integration Test
	implementation fabricApi.module("fabric-gametest-api-v1", project.fabric_api_version)
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
loom {
	runs {
		// Cấu hình cho máy khách (Giữ nguyên thư mục run)
		client {
			client()
			ideConfigGenerated true
			name = "Minecraft Client"
			source sourceSets.main
			runDir "run"
		}
		// Cấu hình cho máy chủ (Đổi sang thư mục run_server riêng biệt)
		server {
			server()
			ideConfigGenerated true
			name = "Minecraft Server"
			source sourceSets.main
			runDir "run_server"
		}
		// Định nghĩa cấu hình chạy chuyên dụng để kích hoạt hệ thống GameTest
		gameTestServer {
			server() // Thiết lập môi trường chạy là máy chủ (Headless Server)
			name "Minecraft GameTest Server"
			vmArg "-Dfabric-api.gametest" // Tham số bắt buộc để kích hoạt bộ nạp GameTest của Fabric
			runDir "run-gametest" // Thư mục riêng biệt để chứa dữ liệu thế giới ảo khi test
		}
	}
}

test{
	useJUnitPlatform()
}

tasks.named('test') {
	useJUnitPlatform()

	// Tùy chọn: Hiển thị kết quả test chi tiết ra màn hình console
	testLogging {
		events "passed", "skipped", "failed"
	}
}

jacoco {
	toolVersion = "0.8.12"
}

jacocoTestReport {
	dependsOn test
	executionData fileTree(layout.buildDirectory).include("jacoco/*.exec")
	reports {
		xml.required = true
		html.required = true
	}
}

// Function to dynamically extract changelog for current version
def getChangelogText() {
	def changelogFile = rootProject.file("CHANGE_LOG.md")
	if (!changelogFile.exists()) return "No changelog provided."
	
	def versionStr = project.version.toString().split('-')[0]
	
	def lines = changelogFile.readLines()
	def changelogText = ""
	def foundVersion = false
	
	for (line in lines) {
		if (line.startsWith("# ") && line.contains("Version " + versionStr)) {
			foundVersion = true
			continue
		}
		if (foundVersion) {
			if (line.startsWith("---")) {
				break
			}
			changelogText += line + "\n"
		}
	}
	
	return changelogText.trim() ?: "No changelog provided for version ${versionStr}."
}

// Task to print the extracted changelog (for verification)
tasks.register("printChangelog") {
	doLast {
		println "--- EXTRACTED CHANGELOG FOR VERSION ${project.version} ---"
		println getChangelogText()
		println "--------------------------------------------------------"
	}
}

modrinth {
	token = System.getenv("MODRINTH_TOKEN") ?: ""
	projectId = "small-logic-tweaks"
	versionNumber = project.version
	versionName = "Small Logic Tweaks ${project.version}"
	versionType = "release"
	gameVersions = [project.minecraft_version]
	loaders = ["fabric"]
	changelog = getChangelogText()
	
	dependencies {
		required.project "fabric-api"
	}
}

afterEvaluate {
	modrinth {
		uploadFile = project.tasks.findByName("remapJar")
	}
}