plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'com.modrinth.minotaur' version "2.9.0" apply false
}

// [VI] Cấu hình dùng chung cho mọi module (common + từng loader). Logic changelog/phát hành nằm ở root
//      để mọi loader dùng chung một nguồn sự thật.
// [EN] Shared configuration for every module (common + each loader). Changelog/release logic lives at the root
//      so every loader reads the same source of truth.
allprojects {
	version = project.mod_version
	group = project.maven_group
}

subprojects {
	apply plugin: 'java'

	java {
		sourceCompatibility = JavaVersion.VERSION_25
		targetCompatibility = JavaVersion.VERSION_25
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 25
		it.options.encoding = 'UTF-8'
	}
}

// Function to dynamically extract base version without the minecraft suffix
def getBaseVersion() {
	def mcSuffix = "-mc" + project.minecraft_version
	def ver = project.version.toString()
	if (ver.endsWith(mcSuffix)) {
		return ver.substring(0, ver.length() - mcSuffix.length())
	}
	def hyphenIdx = ver.lastIndexOf("-mc")
	if (hyphenIdx > 0) {
		return ver.substring(0, hyphenIdx)
	}
	return ver.split('-')[0]
}

// Function to dynamically extract version release type (release, beta, alpha)
def getVersionType() {
	def changelogFile = rootProject.file("CHANGE_LOG.md")
	def baseVer = getBaseVersion()
	
	if (changelogFile.exists()) {
		def lines = changelogFile.readLines()
		def foundVersion = false
		
		for (line in lines) {
			if (line.startsWith("# ") && (line.contains("Version " + baseVer) || line.contains("Version: " + baseVer))) {
				foundVersion = true
				continue
			}
			if (foundVersion) {
				if (line.startsWith("---")) break
				def trimmed = line.trim()
				if (trimmed.toLowerCase().startsWith("**status:**") || trimmed.toLowerCase().startsWith("status:")) {
					def statusLower = trimmed.toLowerCase()
					if (statusLower.contains("release")) return "release"
					if (statusLower.contains("beta")) return "beta"
					if (statusLower.contains("alpha")) return "alpha"
				}
			}
		}
	}
	
	// Fallback based on version string
	def verLower = project.version.toString().toLowerCase()
	if (verLower.contains("alpha")) return "alpha"
	if (verLower.contains("beta")) return "beta"
	return "release"
}

// Function to dynamically extract changelog for current version
def getChangelogText() {
	def changelogFile = rootProject.file("CHANGE_LOG.md")
	if (!changelogFile.exists()) return "No changelog provided."
	
	def baseVer = getBaseVersion()
	def lines = changelogFile.readLines()
	def changelogText = ""
	def foundVersion = false
	
	for (line in lines) {
		if (line.startsWith("# ") && (line.contains("Version " + baseVer) || line.contains("Version: " + baseVer))) {
			foundVersion = true
			changelogText += line + "\n"
			continue
		}
		if (foundVersion) {
			if (line.startsWith("---")) {
				break
			}
			changelogText += line + "\n"
		}
	}
	
	return changelogText.trim() ?: "No changelog provided for version ${baseVer}."
}

// Task to print the extracted changelog & metadata (for verification)
tasks.register("printChangelog") {
	doLast {
		println "--- VERSION & CHANGELOG INFO ---"
		println "Full Mod Version  : ${project.version}"
		println "Base Version      : ${getBaseVersion()}"
		println "Detected Type     : ${getVersionType()}"
		println "Target Minecraft  : ${project.minecraft_version}"
		println "--- EXTRACTED CHANGELOG ---"
		println getChangelogText()
		println "--------------------------------"
	}
}

// Task to verify changelog is not empty or missing
tasks.register("verifyChangelog") {
	doLast {
		def text = getChangelogText()
		if (text.startsWith("No changelog provided")) {
			throw new GradleException("Error: Changelog is missing for version: ${project.version}")
		}
		println "Changelog verified successfully (Base: ${getBaseVersion()}, Type: ${getVersionType()})."
	}
}

def modrinthVersionType = getVersionType()
def modrinthChangelog = getChangelogText()

// [VI] Thông số phát hành do scripts/deploy.ps1 truyền vào từ scripts/deploy_config.json (-PmodrinthProjectId, -PmodrinthLoaders=fabric,quilt)
// [EN] Release parameters passed by scripts/deploy.ps1 from scripts/deploy_config.json (-PmodrinthProjectId, -PmodrinthLoaders=fabric,quilt)
def releaseProjectId = (project.findProperty("modrinthProjectId") ?: "small-logic-tweak").toString()
def releaseLoaders = (project.findProperty("modrinthLoaders") ?: "fabric").toString().split(",")*.trim().findAll { it }
def releaseVersionName = "Small Logic Tweaks ${project.version}"

// Shared with the loader modules (read as rootProject.ext.<name>)
ext.releaseVersionType = modrinthVersionType
ext.releaseChangelog = modrinthChangelog
ext.releaseProjectId = releaseProjectId
ext.releaseLoaders = releaseLoaders
ext.releaseVersionName = releaseVersionName

// Task to export release metadata as JSON for scripts/deploy.ps1 (single source of truth for version/type/changelog parsing)
tasks.register("exportReleaseInfo") {
	def outFile = layout.buildDirectory.file("release/info.json")
	outputs.upToDateWhen { false }
	doLast {
		def jarFile = project(":fabric").tasks.named("jar").get().archiveFile.get().asFile
		def info = [
			modVersion      : project.version.toString(),
			baseVersion     : getBaseVersion(),
			minecraftVersion: project.minecraft_version.toString(),
			versionType     : getVersionType(),
			versionName     : releaseVersionName.toString(),
			loaders         : releaseLoaders,
			jar             : rootProject.relativePath(jarFile).replace(File.separator, '/'),
			changelog       : getChangelogText()
		]
		def file = outFile.get().asFile
		file.parentFile.mkdirs()
		file.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(info)), "UTF-8")
		println "Release info written to ${file}"
	}
}
